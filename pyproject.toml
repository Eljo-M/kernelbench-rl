[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelbench-rl"
version = "0.1.0"
description = "Autonomous CUDA/Triton GPU Kernel Optimizer via Execution-Feedback GRPO"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
training = [
    "torch>=2.6",
    "transformers>=4.57,<5",
]
qlora = [
    "torch>=2.6",
    "transformers>=4.57,<5",
    "peft>=0.17,<0.19",
    "bitsandbytes>=0.48,<0.50",
    "accelerate>=0.34",
]
gpu = [
    "torch>=2.4",
    "triton>=3.0",
    "transformers>=4.45",
    "vllm>=0.6",
    "accelerate>=0.34",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
include = ["contracts*", "kernels*", "sandbox_runner*", "rl_trainer*", "eval*"]

[tool.setuptools.package-data]
contracts = ["*.json", "*.rs"]
eval = ["*.html", "*.jsonl"]
