[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelbench-rl"
version = "0.2.0"
description = "Execution-feedback GPU kernel synthesis and reproducible verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
training = [
    "torch>=2.6",
    "transformers>=4.57,<5",
]
qlora = [
    "torch>=2.6",
    "transformers>=4.57,<5",
    "peft>=0.17,<0.19",
    "bitsandbytes>=0.48,<0.50",
    "accelerate>=0.34",
]
gpu = [
    "torch>=2.6",
    "triton>=3.0; sys_platform != 'win32'",
    "triton-windows>=3.6,<3.7; sys_platform == 'win32'",
    "transformers>=4.57,<5",
    "accelerate>=0.34",
]
serving = [
    "vllm>=0.6; sys_platform == 'linux'",
]
publication = [
    "reportlab>=4.4,<5",
    "pypdf>=6,<7",
    "Pillow>=11,<14",
    "huggingface-hub>=0.36,<0.37",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.20",
]

[tool.setuptools.packages.find]
include = ["contracts*", "kernels*", "sandbox_runner*", "rl_trainer*", "eval*"]

[tool.setuptools.package-data]
contracts = ["*.json", "*.rs"]
eval = ["*.html", "*.jsonl"]
